<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="100%" height="24">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="div-glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Line -->
  <line x1="50" y1="12" x2="750" y2="12" stroke="url(#div-grad)" stroke-width="1.5" />
  <!-- Center Elements -->
  <g transform="translate(400, 12)" filter="url(#div-glow)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#00e5ff" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    <circle cx="-25" cy="0" r="1.5" fill="#00e5ff" fill-opacity="0.7" />
    <circle cx="25" cy="0" r="1.5" fill="#3b82f6" fill-opacity="0.7" />
    <circle cx="-50" cy="0" r="1" fill="#00e5ff" fill-opacity="0.4" />
    <circle cx="50" cy="0" r="1" fill="#3b82f6" fill-opacity="0.4" />
  </g>
</svg>